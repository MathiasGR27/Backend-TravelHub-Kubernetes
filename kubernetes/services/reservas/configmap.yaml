apiVersion: v1
kind: ConfigMap
metadata:
  name: reservas-config
  namespace: travelhub

data:
  PORT: "4003"
  HOST: "0.0.0.0"

  DB_HOST: "postgres-reservas"
  DB_PORT: "5432"
  DB_NAME: "travelhub_reservas"

  AUTH_SERVICE_URL: "http://auth-service:4001"
  VUELOS_SERVICE_URL: "http://vuelos-service:4002"

  OTEL_SERVICE_NAME: "reservas-service"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_PROPAGATORS: "tracecontext,baggage"