apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: travelhub
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-auth

  template:
    metadata:
      labels:
        app: postgres-auth

    spec:
      containers:
        - name: postgres-auth

          image: postgres:17-alpine

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-auth-secret

          volumeMounts:
            - name: postgres-auth-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
        - name: postgres-auth-data
          persistentVolumeClaim:
            claimName: postgres-auth-pvc