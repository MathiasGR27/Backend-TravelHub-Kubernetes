apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: travelhub

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: travelhub-auth:1.1
          imagePullPolicy: Never

          ports:
            - containerPort: 4001

          envFrom:
            - configMapRef:
                name: auth-config

            - secretRef:
                name: auth-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 20
            periodSeconds: 10