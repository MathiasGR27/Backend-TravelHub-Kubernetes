apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: travelhub

data:
  PORT: "4001"
  HOST: "0.0.0.0"

  DB_HOST: "postgres-auth"
  DB_PORT: "5432"
  DB_NAME: "travelhub_auth"

  OTEL_SERVICE_NAME: "auth-service"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_PROPAGATORS: "tracecontext,baggage"