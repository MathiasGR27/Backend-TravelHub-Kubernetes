apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: travelhub

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: travelhub-api-gateway:1.1
          imagePullPolicy: Never

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: api-gateway-config

          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10